      group_reference_source: "Source de référence"
      group_reference_date: "Date de référence"
      group_synchronized_at: "Dernière synchronisation"
      datasets: "Datasets"
      no_dataset: "Aucun dataset"
      dataset_totals_note: "Un titre ou une cotation peut appartenir à plusieurs datasets ; les totaux par dataset ne sont donc pas nécessairement additifs."
      dataset_security_count: "Titres"
      dataset_quote_count: "Cotations"
      dataset_groups: "Membres par groupe"
      dataset_history_from: "Date minimale demandée"
      dataset_quotes_file: "Fichier de cotations"
      dataset_labels_file: "Fichier de libellés"
      dataset_imported_at: "Dernier import complet"
      dataset_import_period: "Période du dernier import complet"
      dataset_current_period: "Période actuellement disponible"
      dataset_freshness_date_last: "Date de fraîcheur globale (95 %)"
      freshness_unavailable: "non disponible"
      not_available: "non disponible avant le prochain import complet"
      integrity:
        title: "Contrôles"
        securities_without_dataset: "Titres sans dataset"
        datasets_without_security: "Datasets sans titre"
        securities_without_quote: "Titres sans cotation"
        quotes_without_dataset: "Cotations sans dataset"
        dataset_stats_mismatches: "Statistiques de dataset incohérentes"
        foreign_key_violations: "Violations de clés étrangères"
        result: "Résultat"
        ok: "OK"
        failed: "ANOMALIES DÉTECTÉES"
    list:
      header: "Liste les titres d'une base de marché"
      banner: |
        Description :
          Liste les titres présents dans la base de marché. L'option --dataset
          permet de limiter la liste à un dataset. Un filtre regex facultatif peut
          porter sur l'ensemble des champs ou sur un champ nommé.
      usage: |
        Usage :
          jedi market list <source> [regex] [options]
      required_arguments: |
        Arguments requis :
          <source>                         Source de la base
      filters:
        regex: |2-
                                             Les champs filtrables sont : isin, ticker, name, group, dataset.
      # filters: |
      #   Filtres :
      #     [regex]    Expression régulière appliquée à tous les champs.
      #                Champs nommés : isin, ticker, name, group, dataset.
      #                Les opérateurs && et || sont disponibles ; && est prioritaire.
      examples: |
        Exemples :
          jedi market list abcbourse
          jedi market list abcbourse air
          jedi market list abcbourse 'group=PEA && name=air'
          jedi market list abcbourse --dataset=Euronext_Growth
          jedi market list abcbourse 'ticker=^AL' --dataset=Euronext_A
          jedi market list abcbourse --last-quote
      table:
        title:
          all: "Titres de la base de marché"
          one: "Titre sélectionné dans la base de marché"
          some: "Titres sélectionnés dans la base de marché"
          dataset_all: "Titres du dataset '%{dataset}'"
          dataset_one: "Titre sélectionné dans le dataset '%{dataset}'"
          dataset_some: "Titres sélectionnés dans le dataset '%{dataset}'"
        isin: "ISIN"
        ticker: "Ticker"
        name: "Nom"
        groups: "Groupe(s)"
        datasets: "Dataset(s)"
        date: "Date"
        close: "Clôture"
    quote:
      header: "Affiche l’historique des cotations d’un titre"
      banner: |
        Description :
          Affiche l’historique OHLCV complet d’un titre de la base de marché.
          La sélection par date est appliquée avant la sélection d’enregistrements.
      usage: |
        Usage :
          jedi market quote <source> <ISIN> [options]
      required_arguments: |
        Arguments requis :
          <source>   Source de la base
          <ISIN>     Code ISIN du titre
      examples: |
        Exemples :
          jedi market quote abcbourse FR0000120073
          jedi market quote abcbourse FR0000120073 --date=ge:2026-01-01
          jedi market quote abcbourse FR0000120073 --select=20
          jedi market quote abcbourse FR0000120073 --date=ge:2026-01-01 --select=l20
      table:
        title: "Historique des cotations de %{ticker} (%{isin}) — %{name}"
        date: "Date"
        open: "Ouverture"
        high: "Plus haut"
        low: "Plus bas"
        close: "Clôture"
        volume: "Volume"
