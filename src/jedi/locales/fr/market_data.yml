fr:
  market:
    header: "Gère les bases de cotations de marché"
    banner: |
      Bases de cotations de marché

      Usage : jedi market <sous-commande>
    options:
      universe: "Univers général utilisé dans le nom de la base (défaut : %{universe})"
      date_order: "Ordre de date : auto, ymd, dmy ou mdy (défaut : auto)"
      year_pivot: "Pivot des années sur deux chiffres, de 0 à 99 (défaut : 70)"
      from: "Première date de cotation conservée, au format AAAA-MM-JJ"
      allow_gap: "Accepte explicitement une lacune historique supérieure à 7 jours calendaires"
      as_of: "Date de référence de la composition du groupe, au format AAAA-MM-JJ"
      reference_source: "Source de référence de la composition du groupe"
      group_add: "Ajoute le titre au groupe"
      group_remove: "Retire le titre du groupe"
      dataset: "Limite le rapport au dataset indiqué"
      last_quote: "Ajoute la date et la clôture de la dernière cotation"
      date: "Sélectionne les cotations par date (ge, gt, le ou lt), format OP:AAAA-MM-JJ"
    init:
      header: "Crée une base de marché vide"
      banner: |
        Description :
          Crée une base vide pour une source et un univers général. Les datasets
          sont ensuite ajoutés avec la sous-commande import.
      usage: |
        Usage :
          jedi market init <source> [options]
      required_arguments: |
        Arguments requis :
          <source>                         Nom logique de la source utilisé dans le nom de la base
      examples: |
        Exemple :
          jedi market init abcbourse
    import:
      header: "Importe un nouveau dataset"
      banner: |
        Description :
          Ajoute un ensemble de titres et de cotations dans une base existante.
          Les ISIN sans libellé sont ignorés et recensés dans le rapport.
      usage: |
        Usage :
          jedi market import <source> <dataset> <quotes> <labels> [options]
      required_arguments: |
        Arguments requis :
          <source>                         Source de la base
          <dataset>                        Code libre du dataset, par exemple Euronext_A
          <quotes>                         Fichier de cotations
          <labels>                         Fichier de libellés ISIN;Name;Ticker
      examples: |
        Exemples :
          jedi market import abcbourse Euronext_A Euronext_A.txt labels.txt
          jedi market import abcbourse Euronext_A Euronext_A.txt labels.txt --from=2020-01-01
    replace:
      header: "Remplace un dataset existant"
      banner: |
        Description :
          Remplace transactionnellement un dataset. Les données partagées avec
          d'autres datasets sont conservées.
      usage: |
        Usage :
          jedi market replace <source> <dataset> <quotes> <labels> [options]
      required_arguments: |
        Arguments requis :
          <source>                         Source de la base
          <dataset>                        Code du dataset à remplacer
          <quotes>                         Nouveau fichier de cotations
          <labels>                         Fichier de libellés ISIN;Name;Ticker
      examples: |
        Exemples :
          jedi market replace abcbourse Euronext_A Euronext_A.txt labels.txt
          jedi market replace abcbourse Euronext_A Euronext_A.txt labels.txt --from=2020-01-01 --noconfirm
      confirm: "Remplacer le dataset '%{dataset}' dans la base '%{database}' ? "
    update:
      header: "Met à jour un dataset existant"
      banner: |
        Description :
          Fusionne sans suppression les titres et cotations dans un dataset
          existant. Les doublons équivalents sont ignorés ; une cotation
          conflictuelle est signalée et ignorée. Une extension située à plus de
          7 jours calendaires de la fin actuelle du dataset est refusée, sauf
          avec --allow-gap.
      usage: |
        Usage :
          jedi market update <source> <dataset> <quotes> <labels> [options]
      required_arguments: |
        Arguments requis :
          <source>                         Source de la base
          <dataset>                        Code du dataset à mettre à jour
          <quotes>                         Fichier de cotations de mise à jour
          <labels>                         Fichier de libellés ISIN;Name;Ticker
      examples: |
        Exemples :
          jedi market update abcbourse Euronext_A Euronext_A_update.txt labels.txt
          jedi market update abcbourse Euronext_A Euronext_A_update.txt labels.txt --allow-gap
    sync_group:
      header: "Synchronise un groupe de marché"
      banner: |
        Description :
          Remplace transactionnellement la composition d'un groupe nommé à
          partir d'un fichier simple contenant un ISIN ou un ticker en début
          de ligne. Un libellé peut suivre après un espace, ';' ou ':'. Les
          lignes vides et celles commençant par # sont ignorées. Les membres
          absents du fichier sont retirés du groupe.
      usage: |
        Usage :
          jedi market sync-group <source> <groupe> <fichier_references> [options]
      required_arguments: |
        Arguments requis :
          <source>                         Source de la base
          <groupe>                         Code libre du groupe, par exemple PEA
          <fichier_references>             Fichier contenant un ISIN ou ticker en début de ligne
      examples: |
        Exemple :
          jedi market sync-group abcbourse PEA pea.txt --reference-source=prorealtime --as-of=2026-09-24
    group:
      header: "Modifie manuellement un groupe de marché"
      banner: |
        Description :
          Ajoute un titre à un groupe existant ou l'en retire.
      usage: |
        Usage :
          jedi market group <source> <groupe> <ISIN> (--add | --remove) [options]
      required_arguments: |
        Arguments requis :
          <source>                         Source de la base
          <groupe>                         Code du groupe existant
          <ISIN>                           Code ISIN du titre
      examples: |
        Exemples :
          jedi market group abcbourse PEA FR0000031122 --add
          jedi market group abcbourse PEA FR0000031122 --remove
      one_action_required: "Indiquez exactement une des options --add ou --remove."
      updated: "%{ticker} (%{isin}) est maintenant %{membership} du groupe %{group}."
      member: "membre"
      not_member: "absent"
    info:
      header: "Affiche le contenu d'une base de marché"
      banner: |
        Description :
          Affiche un rapport global sur la base, le détail de chaque dataset et
          quelques contrôles d'intégrité.
      usage: |
        Usage :
          jedi market info <source> [options]
      required_arguments: |
        Arguments requis :
          <source>                         Source de la base
      examples: |
        Exemples :
          jedi market info abcbourse
          jedi market info abcbourse --dataset=Euronext_A
      title: "Informations sur la base de marché"
      source: "Source"
      universe: "Univers"
      database: "Fichier"
      schema_version: "Version du schéma"
      file_size: "Taille"
