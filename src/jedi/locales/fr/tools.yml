      database_history_empty: "Aucune cotation n'est disponible pour '%{ident}' dans la base de marché '%{database}'."
      option_date_invalid: "Valeur --date '%{value}' non valide (format attendu : OP:AAAA-MM-JJ)."
      date_operator_invalid: "Opérateur de date '%{operator}' non valide (valeurs attendues : ge, gt, le ou lt)."
      date_selection_invalid: "Date '%{date}' non valide (format attendu : AAAA-MM-JJ)."
      database_security_required: "L'option %{option} est requise avec --database."
      option_requires_database: "L'option %{option} nécessite --database."
    #
    # --- calc ---
    #
    calc:
      header: "Calculatrice Jedi sur barème de type I"
      banner: |
        Description :
          Calculatrice Jedi sur barème de type I

          "Maîtriser les calculs internes de Jedi par la pratique"

          Seuls les barèmes de type I sont supportés. Utiliser la commande 'tools play'
          pour des simulations complexes, mixant barèmes de type I et type II.
      usage: |
        Usage:
          jedi tools calc <kcb | kcp | ksp | cpe | spe | quantity | price> <params> [options]
      required_arguments: |
        Arguments requis : 
                         --- fonctions ---
          <kcb>                            Coefficient de capital
          <kcp>                            Coefficient de prix
          <ksp>                            Coefficient de quantité
          <cpe>                            Cours théorique (au palier/échelon)
          <spe>                            Stock théorique (au palier/échelon)
          <quantity>                       Quantité de l'ordre (<0 = Vente, >0 = Achat)
          <price>                          Cours de l'ordre arrondi au pas de cotation
      params: |2-
          Selon le calcul demandé, les paramètres à fournir dans <params> sont :
                         --- arguments ---
          <scale>                          Barème de type I (nom ou constructeur littéral)
          <position>                       Position cible
          <q0>                             Quantité d'achat initial
          <c0>                             Prix d'achat initial
          <dir>                            Direction des prix : valeurs 'up' ou 'down'
          <stock>                          Stock existant
          <tick>                           Pas de cotation
      notes: |
        Notes:
          Relation entre calcul demandé et paramètres requis :
          kcb      : scale, position
          kcp      : scale, position
          ksp      : scale, position
          spe      : scale, position, q0
          cpe      : scale, position, c0
          quantity : spe, stock
          price    : cpe, tick, dir
      examples: |
        Exemples :
          jedi tools calc kcb scale=qdt position=1:1:1
          jedi tools calc cpe scale="vr:20%,np:3,nn:3,ki:20%,kb:1,kd:0.2" position=1:1:0 c0=10 lsp=12 dir=up
      title: "Calculatrice Jedi"
      missing_function: "Argument manquant: fonction à calculer."
      invalid_format: "Format de l'argument '%{arg}' non valide."
      unknown_parameter: "Paramètre '%{arg}' non valide."
      missing_scale: "Paramètre 'scale' manquant (nom de barème ou constructeur littéral)."
      unsupported_scale_type: "Barème de type II non pris en charge."
      missing_position: "Paramètre 'position' manquant."
      incompatible_position: "Position '%{position}' incompatible avec le barème."
      unknown_function: "Fonction '%{key}' inconnue."
      unused_arguments: "Argument(s) non utilisé(s) :"
      missing_price_direction: "Paramètre 'direction des prix' manquant."
      invalid_price_direction: "Argument '%{dir}' non valide pour la direction des prix."
      missing_tick: "Pas de cotation manquant."
    #
    # --- play ---
    #
    play:
      header: "Simule l'application d'un barème en fonction des paramètres fournis"
      warning: "Après l'opération n° %{operation} : %{warning}"
      banner: |
        Description :
          Simule l'application d'un barème en fonction des paramètres fournis
      usage: |
        Usage :
          1ère forme : à partir de l'environnement d'une opération de production
            jedi tools play <id> <args>... [options]

          2ème forme : à partir d'un environnement créé
            jedi tools play <environment> <args>... [options]
      required_arguments: |
        Arguments requis :
          <id>                             Id d'une opération de la base de données à partir de laquelle
                                           sera défini l'environnement de simulation

          <environnement>                  Une liste de paramètres pour créer l'environnement de simulation
                                           à partir de zéro, en utilisant les entités concaténées suivantes:
                                           <scale>, <q0>, <c0>, <tick>, [<money>]

          <args>...                        Liste d'arguments définissant le scénario de simulation, chaque argument
                                           pouvant prendre l'une des formes suivantes :
                                           - Un entier, positif ou négatif, indique le nombre d'échelons à franchir à
                                             la hausse ou à la baisse (le zéro prenant aléatoirement la valeur 1 ou -1)
                                           - Une liste d'entiers, séparés par des virgules, possiblement précédée
                                             par un facteur multiplicatif (ex: 3x1,-1,0)
                                           - Une valeur décimale, définissant un prix cible
                                           - Une transaction "réelle", sous la forme q@p (q=quantité, p=prix), où la
                                             variation de prix doit confirmer le signe de la quantité (< 0 = vente,
                                             > 0 = achat)
                                           - Un nouveau jeu de paramètres, comprenant mots-clés et valeurs associées
                                             (scale=?, split=?, sync=?, reinit=?, loss=?, loss_trigger=?)
                                             Split peut accompagner reinit=reset ou reinit=merge ; les prix
                                             sont alors exprimés après le split. Merge nécessite ensuite
                                             une transaction manuelle q@p. Sync reste une option séparée.
                                           - Une nouvelle définition de la gestion du capital avec money=?
                                           - Un nouveau statut de stop avec stop=?
                                           - Une marque définissant le début du calcul des résultats financiers de
                                             la simulation, avec 'mark'
      option_command: |-
        Affiche les résultats selon les caractères de commande suivants :
          t : liste des trades       ) Les listes ci-contre peuvent être personnalisées
          k : liste des titres       ) en sélectionnant les numéros d'index des colonnes
          s : liste des barèmes      ) à afficher, selon l'ordre des index, avec la syntaxe :
          c : liste des paramètres   ) n : numéro de colonne, n-m : intervalle de colonnes..
          o : liste des opérations   ) Ex: o0,6-9,17,14-13 pour afficher les colonnes 0,6,7,8,9,17,14,13

          r : liste des ordres
          f : résultats
          d : deboggage
      examples: |-
        Exemples:
          jedi tools play -c o0,4,6-13,17rf -- scale=vr:10%,np:3,nn:3,ki:10%,kb:1,kd:0.0,q0=100,c0=10.0,tick=0.02 5 \
                                               money=r:1.5%,o:1,n:2 -5
          jedi tools play -- 811 3x1,-1 scale=vr:12%,np:3,sr:15%,nn:4,mi:300%,ki:15%,kb:1 2
      orders:
        title: "Ordres en attente"
        oper: "Opér."
        type: "Type"
        mode: "Mode"
        quantity: "Quantité"
        price: "Cours"
        position: "Position"
        spe: "SPE"
        cpe: "CPE"
