  tools:
    header: "La boîte à outils de Jedi"
    banner: |
      La boîte à outils de Jedi

      Usage: jedi tools <sous-commande>

      sous-commandes :
    quote_history:
      file_not_found: "Fichier de cotations '%{filename}' introuvable."
