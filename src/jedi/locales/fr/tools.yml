    score:
      header: Recherche et classe des barèmes sur un historique de cotations
      banner: |
        Description :
          Recherche automatiquement les barèmes les plus adaptés à un historique de cotations.
          Sans constructeur explicite, Jedi explore ses trois familles internes de barèmes.
      usage: |
        Usage :
          Depuis un fichier :
            jedi tools score <fichier_cotations> [<constructeur>] [options]

          Depuis une base de marché :
            jedi tools score --database=SOURCE --security=IDENT [<constructeur>] [options]

          Le constructeur est optionnel. P1, P2 et P3 restent acceptés comme sélections
          expertes d'une seule famille interne.
      option_database: Charge les cotations depuis la base de marché SOURCE
      option_universe: "Sélectionne l'univers de marché NAME (défaut : %{universe})"
      option_security: Sélectionne le titre par ISIN ou ticker
      option_ranking: >-
        Classement affiché : raw (résultats bruts, défaut), jedi (préférence, mode expert)
        ou both (les deux classements)
      option_search: >-
        Stratégie de recherche : adaptive (exploration puis raffinement, défaut) ou grid (exhaustive)
      option_budget: >-
        Nombre maximal de backtests de recherche avec --search=adaptive (défaut : 500)
      option_display: >-
        Affichage : compact (3 métriques de tri + constructeur typé, défaut), study
        (lecture économique des barèmes) ou technical (diagnostic expert ; influence des paramètres
        avec --search=adaptive, robustesse avec --ranking=jedi ou both)
      option_sort: >-
        Tri : fitness (défaut), activity (opérations/mois) ou investment
        (investissement maximal) ; 1, 2 et 3 restent acceptés
      #option_date: *opdate
      #score:
      result:
        to_s: |
          %+6.3f, %.3f, %.3f, barème ---> "%s"
          %22sconstructeur -> "%s"
