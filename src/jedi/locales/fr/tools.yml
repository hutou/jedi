    backtest:
      header: "Simule Jedi sur un historique de cotations"
      banner: |
        Description :
          Simule un ou plusieurs trades sur un historique de cotations.
          Après une clôture complète par stoploss, un nouveau trade est ouvert
          à la séance suivante.
      usage: |
        Usage :
          Depuis un fichier :
            jedi tools backtest <fichier_cotations> --scale=DEF [--money=DEF] [options]

          Depuis une base de marché :
            jedi tools backtest --database=SOURCE --security=IDENT --scale=DEF [--money=DEF] [options]
      option_command: |-
        Sélectionne les sorties :
          r : rapport synthétique
          f : résultats financiers par trade et cumulés
          o : liste des opérations
          t : liste des trades
          d : ordres restant actifs en fin de simulation
          p : graphique en base 1
        Les variantes T, K et S conservent l'affichage étendu de compatibilité.
        Valeur par défaut : r en affichage compact, rf en affichage technique.
      option_display: >-
        Affichage : compact (synthèse économique, défaut) ou technical (rapport complet avec
        diagnostics statistiques). -c permet de choisir les sections affichées.
      #option_date: &opdate "Sélectionne une période avec OP:AAAA-MM-JJ (ge, gt, le ou lt)"
      option_capital: "Définit le capital utilisé pour calculer le montant initial"
      examples: |
        Exemples :
          jedi tools backtest cotations_RNO.txt --scale=Qdt
          jedi tools backtest cotations_RNO.txt --scale=Qdt --money="r:1.5%,o:1,n:2" --capital=20000
          jedi tools backtest --database=abcbourse --security=RNO --scale=Qdt
      positional_arguments: |
        Arguments positionnels :
          <fichier_cotations>   Fichier préparé contenant un seul titre
                                Requis uniquement lorsque --database est absent
