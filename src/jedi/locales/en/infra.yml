        - ascii         - modern         - markdown   - empty 
        - reducedascii  - reducedmodern  - fancy      - blank
    help: "Show this help"
    #
    # Generic options, independent from call site
    #
    option_records: |-
      Selects the records defined in RECORDS, a comma-separated 
      list of elements, with the following syntax:
      - The letter F or L (case insensitive), followed by an 
        integer, to designate the first or last records to be 
        selected, respectively
      - A positive or (negative integer for end-of-array indexing)
      - A range of two integers, positive or negative, separated 
        by a colon.
      Example: "f10,-12:-1" for selecting the first 10 records 
               and the last 12 ones
    option_regex: |-
      Regex filter, case insensitive, on the concatenation 
      of all filterable fields.
      && = AND, || = OR, with && before ||.
      Examples: abc, abc && xyz, abc || xyz, a && b || c && d.
      Each term is an independent regex. Field order does not 
      matter. No parentheses support.
    option_columns: |-
      Select column indexes to display, using a list of integers
      or range of integers, such as 1,2,5-8,10,13-16. Columnswill
      be displayed in the order of indexes, and ranges can be 
      inverted (ex: 2,1,8-5,15,10 order will be 2,1,8,7,6,5,15,10)
      (not compatible with option --csv)
    option_reinit: |-
      Reset the trade with VALUE = 'reset,<price>' or 'merge,<price>': 
      May be combined with --split. In that case, <price> and the following
      execution price must use the post-split unit.
      - The financial results of past transactions are retained
      - The history of previous settings is cleared
      - Depending on the parameters passed to the option, the calculation 
        basis (q0 and c0) is redefined as follows:
        - With ‘reset, <price>’: q0 takes the value of the existing position, 
          and c0 takes the value of the <price> parameter
        - With ‘merge, <price>’, q0 and c0 are calculated using a weighted average 
          that takes into account their current values and those of the upcoming 
          transaction—a buy or sell—initiated by the user. This allows the user 
          to increase or decrease the amount invested in the trade.
    option_split: |-
      Performs a stock split or reverse stock split, based on the ratio
      established by the values of ‘NEW’ and ‘OLD’, i.e., ‘NEW’ new shares
      for ‘OLD’ old shares.
    option_sync: |-
      After a significant 'gap' or a temporary exit from the trade, resynchronize
      the position at a theoretical price:
      - immediately below the current price in the event of an uptrend,
      - immediately above the current price in the event of a downtrend.
      ** This option applies only to Type I scales **
    option_csv: "Exports records in CSV format"
    option_headers: "Includes headers when CSV selected"
    option_running: "Running trades only"
    option_update_now: "Force updating quotes"
    option_layout: |-
      Displays the table in different layouts, suitable for:
        0 = most useful columns (default)
        1 = All columns
        2, 3 = (reduced columns, for doc)
    option_date: "Selects a period with OP:YYYY-MM-DD (ge, gt, le or lt)"
    command_options: "Command options:"
    exclusive_options: "Options '%{opt1}' and '%{opt2}' are mutually exclusive"
    system_exception: "System Exception: %{ex_message}"
    io_error: "IO Error: %{ex_message}"
