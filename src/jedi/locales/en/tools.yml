    #
    # --- scare ---
    #
    score:
      header: Search and rank scales on a quotation history
      banner: |
        Description:
          Automatically searches for the scales best suited to a quotation history.
          Without an explicit builder, Jedi explores its three internal scale families.
      usage: |
        Usage:
          From a file:
            jedi tools score <quotes_file> [<builder>] [options]

          From a market database:
            jedi tools score --database=SOURCE --security=IDENT [<builder>] [options]

          The builder is optional. P1, P2 and P3 remain accepted as expert selections
          of one internal search family.
      option_database: Load quotations from market database SOURCE
      option_universe: "Select market universe NAME (default: %{universe})"
      option_security: Select the security by ISIN or ticker
      option_ranking: >-
        Displayed ranking: raw (raw results, default), jedi (preference, expert mode)
        or both (both rankings)
      option_search: >-
        Search strategy: adaptive (exploration then refinement, default) or grid (exhaustive)
      option_budget: >-
        Maximum number of main-search backtests with --search=adaptive (default: 500)
      option_display: >-
        Display: compact (3 ordering metrics + typed builder, default), study
        (economic reading of scales) or technical (expert diagnostics; parameter influence
        with --search=adaptive, robustness with --ranking=jedi or both)
      option_sort: >-
        Sort: fitness (default), activity (operations/month) or investment
        (maximum investment); 1, 2 and 3 remain accepted
      # from score:
      result:
        to_s: |
          %+6.3f, %.3f, %.3f, scale ---> "%s"
          %22sbuilder -> "%s"
      run:
        selection: "none"
      decode:
        rate_invalid: "tools score: error decoding rate loop '%{rate}'"
        steps_counts: "tools score: invalid number of positive and negative"
        letter_code_unknown: "tools score: unknown letter code '%{letter}'"
        key_not_found: "tools score: key '%{predefkey}' not defined"
        key_not_bound: "tools score: no builder bound to key '%{predefkey}'"
        score_1: "1 - Canonical - ks optimized"
        score_2: "2 - Canonical - ks optimized"
        score_3: "1 - Canonical - ks optimized"
      list:
        scales: "Scales"
        type: "Type: "
        isin: "ISIN: "
        ticker: "Ticker: "
        name: "Name: "
        first_date: "First date: "
        last_date: "Last date: "
        selected: "Selected: "
        trading_days: "Trading days: "
        volatility: "Volatility: "
        regression_slope: "Raw slope (price unit/day): "
        scale_builder: "Scale builder: "
        search: "Search: "
        fields_hdr: |-
          Output fields, separated by commas:
            1 : Gain coefficient (>0) or loss coefficient (<0)
            2 : Average number of transactions per month
            3 : Maximum investment ratio
            4 : Scale definition
            5 : Builder definition
        regression_trend: "Relative trend (% of initial price/day): "
      invalid_builder: "tools score: invalid scale builder '%{scale_builder}'"
      invalid_sort: "tools score: invalid sort '%{value}' (expected: fitness, activity or investment)"
      context:
        security: "Security: %{name} (%{ticker}, %{isin})"
        period: "History: %{first} → %{last} (%{days} sessions)"
        opening_amount: "Requested opening amount: %{amount} €"
        search: "Search %{strategy}: %{evaluated} backtests, %{available} available candidates"
        budget: " (budget: %{budget})"
        partial_search: "Partial search: the ranking covers the evaluated scales."
        ranking: "Ranking: %{ranking}"
        rankings:
          raw: "transparent raw results (raw)"
          jedi: "Jedi preference (expert mode)"
          both: "transparent raw results, then Jedi preference (expert mode)"
        raw_order: "Raw order (to 3 decimal places): %{order}"
        search_order: "Search objective (to 3 decimal places): %{order}"
        orders:
          fitness: "Fitness descending, then Op/mo descending, then Max.inv ascending"
          activity: "Op/mo descending, then Fitness descending, then Max.inv ascending"
          investment: "Max.inv ascending, then Op/mo descending, then Fitness descending"
      compact:
        title: "Recommended scales"
        raw_title: "Raw results"
        columns: " Fitness   Op/mo   Max.inv  Typed builder"
        empty: "No admissible scale."
        ratios_note: >-
          Fitness = gross gain / first purchase; Max.inv = maximum investment / first purchase,
          excluding fees. Example: Fitness 0.500 = gross gain of 50% of the first purchase;
          Max.inv 1.500 = maximum investment of 1.5 times that first purchase.
        activity_note: >-
          Op/mo = all operations, including openings, normalized to 21 sessions from the first operation.
      study:
        title: "Economic study of recommended scales"
        raw_title: "Economic study of raw results"
        evaluated_title: "Top evaluated candidates before Jedi filtering"
        columns: "Rank GrossF    NetF   NetR%   AnnR%  Op/yr  Ops Max.inv€   Fees€   Vr%  Fam  Typed builder"
        empty: "No admissible scale to study."
        note: >-
          GrossF/NetF = gross/net gain divided by the initial purchase; NetR% = net return on maximum
          investment; AnnR% = annualized net return on maximum investment; Op/yr = scale-generated
          operations per year excluding openings; Ops = all operations.
      display:
        invalid_mode: "tools score: invalid display '%{value}' (expected: compact, study or technical)"
      search:
        title: "Adaptive search"
        strategy: "Strategy: "
        available: "Available candidates: "
        evaluated: "Evaluated search backtests: "
        exploration: "Exploration: "
        refinement: "Refinement: "
        reduction: "Backtest reduction: "
        influence_title: "Indicative parameter influence (primary sort criterion)"
        influence_note: >-
          Descriptive estimate computed only from the exploration sample; it
          measures variation in the median primary --sort criterion and is not a causal measure
          independent of parameter interactions.
        invalid_strategy: "tools score: invalid search strategy '%{value}' (expected: grid or adaptive)"
        invalid_budget: "tools score: invalid search budget '%{value}' (expected a strictly positive integer)"
      preference:
        title: "Jedi preference among neighboring results"
        explanation: >-
          The Jedi ranking first measures local robustness inside each search
          family, then globally groups scales with exactly the same historical
          behavior, rejects terminally inoperable states, historically weak or overly
          concentrated activity, and removes insufficiently exercised extents. Among
          economically neighboring results, it favors temporal stability, regular
          activity, a local plateau, meaningful coverage, moderate investment and a
          simple structure.
        columns: >-
          Jedi Raw Grp  Fitness   Op/mo  Max.inv  Act/mo  Avg12    σ12  0-12m  Idle Loc.med Loc.disp Tmp.med Tmp.min       Coverage Unusd Eq Compl.  Fam  Search configuration
        preferred: "Preferred configuration:"
        redundant_removed: "%{count} behaviorally redundant scale(s) hidden."
        insignificant_removed: "%{count} insufficiently exercised scale(s) removed."
        inoperable_removed: "%{count} scale(s) removed: terminal state is not operable."
        inactive_removed: "%{count} scale(s) removed: historical activity is insufficient or too concentrated."
        invalid_ranking: "tools score: invalid ranking '%{value}' (expected: raw, jedi or both)"
        reasons:
          temporal_stability: "regular results across time periods"
          temporal_caution: "temporal stability requires caution"
          regular_activity: "scale activity regularly distributed"
          local_plateau: "local plateau of good results"
          ideal_coverage: "ideal one-step outer margin"
          significant_coverage: "scale extent sufficiently exercised"
          canonical_representative: "canonical representative of %{count} equivalent scales"
          central: "configuration away from search boundaries"
          moderate_investment: "maximum investment taken into account"
    #
    # --- plot ---
