      security_not_found: "Security '%{ident}' not found in market database '%{database}'."
      database_history_empty: "No quotation is available for '%{ident}' in market database '%{database}'."
      option_date_invalid: "Invalid --date value '%{value}' (expected: OP:YYYY-MM-DD)."
