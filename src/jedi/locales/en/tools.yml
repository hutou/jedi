      date_selection_invalid: "Invalid date '%{date}' (expected: YYYY-MM-DD)."
      database_security_required: "Option %{option} is required with --database."
      option_requires_database: "Option %{option} requires --database."
    #
    # --- calc ---
    #
    calc:
      header: "Jedi calculator"
      banner: |
        Description:
          Jedi calculator

          "Mastering Jedi's internal calculations through practice"

          Only type I scales are supported. Use 'tools play' command for complex
          simulations, mixing type I and type II scales
      usage: |
        Usage:
          jedi tools calc <kcb | kcp | ksp | cpe | spe | quantity | price> <params> [options]
      required_arguments: |
        Required arguments:
                         --- functions ---
          <kcb>                            Capital factor
          <kcp>                            Price-position factor
          <ksp>                            Quantity-position factor
          <cpe>                            Theorical price at position (level/step)
          <spe>                            Theorical stock at position (level/step)
          <quantiy>                        Order quantity (<0 = Sell, >0 = Buy)
          <price>                          Order price rounded to the nearest tick
      params: |2-
          Depending on the requested calculation, parameters to provide in <params> are:
                         --- arguments ---
          <scale>                          Type I scale (name or literal builder)
          <position>                       Target position
          <q0>                             Initial buy quantity
          <c0>                             Initial buy price
          <dir>                            Price direction: 'up' or 'down' values
          <stock>                          Existing stock
          <tick>                           Tick value
      notes: |
        Notes:
          Relation between requested calculation and required parameters:
          kcb      : scale, position
          kcp      : scale, position
          ksp      : scale, position
          spe      : scale, position, q0
          cpe      : scale, position, c0
          quantity : spe, stock
          price    : cpe, tick, dir
      examples: |
        Examples:
          jedi tools calc kcb scale=qdt position=1:1:1
          jedi tools calc price scale=qdt position=1:1:0 tick=0.02 c0=10 dir=up
      title: "Jedi calculator"
      missing_function: "Missing argument: function to be evaluated."
      invalid_format: "Invalid format for the ‘%{arg}’ argument."
      unknown_parameter: "Invalid parameter ‘%{arg}’."
      missing_scale: "Missing ‘scale’ parameter (scale name or literal constructor)."
      unsupported_scale_type: "Type II scale not supported."
      missing_position: "Missing 'position' parameter."
      incompatible_position: "Position ‘%{position}’ incompatible with the scale."
      unknown_function: "Unknown fonction '%{key}'."
      unused_arguments: "Unused argument(s):"
      missing_price_direction: "Missing 'price direction' parameter."
      invalid_price_direction: "Invalid argument '%{dir}' for price direction."
      missing_tick: "Missing tick."
    #
    # --- play ---
    #
    play:
      header: "Simulates the application of a scale based on the provided parameters"
      warning: "After operation #%{operation}: %{warning}"
      banner: |
        Description:
         Simulates the application of a scale based on the provided parameters
      usage: |
        Usage :
          1st form: from a production environment
            jedi tools play <id> <args>... [options]

          2nd form: from a created environment
            jedi tools play <environment> <args>... [options]
      required_arguments: |-
        Required arguments:
          <id>                             ID of a database operation from which
                                           the simulation environment will be defined

          <environment>                    A list of parameters to create the simulation environment
                                           from scratch, using the following concatenated entities:
                                           <scale>, <q0>, <c0>, <tick>, [<money>]

          <args>...                        A list of arguments defining the simulation scenario, where each argument
                                           can take one of the following forms:
                                           - An integer, positive or negative, indicating the number of steps to move
                                             up or down (zero randomly takes the value 1 or -1)
                                           - A list of integers, separated by commas, possibly preceded
                                             by a multiplicative factor (e.g., 3x1,-1,0)
                                           - A decimal value, defining a target price
                                           - A “real” transaction, in the form q@p (q=quantity, p=price), where the
                                             price change must match the sign of the quantity (< 0 = sell,
                                             > 0 = buy)
                                           - A new set of parameters, including keywords and associated values
                                             (scale=?, split=?, sync=?, reinit=?, loss=?, loss_trigger=?)
                                             Split may accompany reinit=reset or reinit=merge; prices then
                                             use the post-split unit. Merge requires a following manual
                                             transaction q@p. Sync remains a separate option.
                                           - A new definition of capital management with money=?
                                           - A new stop status with stop=?
                                           - A mark defining the start of the calculation of the simulation’s
                                             financial results, with 'mark'
      option_command: |-
        Displays results based on the following command characters:
          t: list of trades         ) The lists shown here can be customized
          k: list of securities     ) by selecting the column index numbers
          s: list of prices         ) to display, in index order, using the following syntax:
          c: list of settings       ) n: column number, n-m: column range
          o: list of operations     ) Ex: o0,6-9,17,14-13 to display columns 0, 6, 7, 8, 9, 17, 14, 13

          r: list of orders
          f: results
          d: debugging
      examples: |-
        Examples:
          jedi tools play -c o0,4,6-13,17rf -- scale=vr:10%,np:3,nn:3,ki:10%,kb:1,kd:0.0,q0=100,c0=10.0,tick=0.02 5 \
                                               money=r:1.5%,o:1,n:2 -5
          jedi tools play -- 811 3x1,-1 scale=vr:12%,np:3,sr:15%,nn:4,mi:300%,ki:15%,kb:1 2
      orders:
        title: "Pending orders"
        oper: "Oper."
        type: "Type"
        mode: "Mode"
        quantity: "Quantity"
        price: "Price"
        position: "Position"
        spe: "SPE"
        cpe: "CPE"
      results:
        title: "Simulation results"
        subtitle: "Results from operation #%{base}"
        subtitle_mark: "Results from operation #%{base}, with mark at operation #%{mark}"
        total: "Total"
        real_initial: "Actual before\nsimulation"
        le_mark: "Simulation up\nto mark"
        gt_mark: "Simulation\nafter mark"
        simulated: "Simulation"
        gains_losses: "Gains / losses"
    #
    # --- backtest ---
    #
    backtest:
      header: "Simulate Jedi on historical quotations"
      banner: |
        Description:
          Simulates one or more trades on historical quotations.
          After a complete stop-loss exit, a new trade starts on the next session.
      usage: |
        Usage:
          From a file:
            jedi tools backtest <quotes_file> --scale=DEF [--money=DEF] [options]

          From a market database:
            jedi tools backtest --database=SOURCE --security=IDENT --scale=DEF [--money=DEF] [options]
      option_command: |-
        Selects output sections:
          r: summary report
          f: financial results by trade and totals
          o: operation list
          t: trade list
          d: orders still active at the end of the simulation
          p: base-one chart
        Compatibility variants T, K and S keep their extended display.
        Default: r in compact display, rf in technical display.
      option_display: >-
        Display: compact (economic summary, default) or technical (full report with statistical
        diagnostics). Use -c to select the displayed sections.
      #option_date: "Selects a period with OP:YYYY-MM-DD (ge, gt, le or lt)"
      option_capital: "Defines the capital used to calculate the initial amount"
      examples: |
        Examples:
          jedi tools backtest quotes_RNO.txt --scale=Qdt
          jedi tools backtest quotes_RNO.txt --scale=Qdt --money="r:1.5%,o:1,n:2" --capital=20000
          jedi tools backtest --database=abcbourse --security=RNO --scale=Qdt
      positional_arguments: |
        Positional arguments:
          <quotes_file>         Prepared file containing one security
                                Required only when --database is absent
      source_options: "Source options:"
      definition_options: "Simulation definition:"
      history_options: "History selection:"
      sizing_options: "Position sizing:"
      execution_options: "OHLC execution:"
      output_options: "Output:"
      option_database: Load quotations from market database SOURCE
      option_universe: "Select market universe NAME (default: %{universe})"
      option_security: Select the security by ISIN or ticker
      option_scale: Scale name or definition (required option)
      option_money: Optional capital-management definition
      option_minimum_quantity: "Minimum quantity required for every checked order (default: 2)"
      option_operability_steps: "Number of upward steps checked for operability (default: %{steps})"
      option_execution: "OHLC execution policy: conservative (default) or legacy"
      option_opening_day_orders:
