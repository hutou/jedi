          jedi tools candidate FR0000131104 --price=76.42 --scale=Qdt --money="r:1%,o:1,n:2"
          jedi tools candidate FR0000131104 --price=76.42 --scale=Qdt --money="r:1%,o:1,n:2" --capital=100000 --extended
