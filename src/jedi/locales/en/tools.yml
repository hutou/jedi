          --price allows evaluation even when the security is not registered in the Jedi database.
      usage: |
        Usage:
          jedi tools candidate <isin> [--price=PRICE] --scale=DEF --amount=AMOUNT [options]
          jedi tools candidate <isin> [--price=PRICE] --scale=DEF --money=DEF [--capital=AMOUNT] [options]
      positional_arguments: |
        Positional argument:
          <isin>                           ISIN of the candidate to evaluate
      definition_options: "Definition and sizing:"
      output_options: "Output:"
      option_price: "Current candidate price; overrides any quotation stored in Jedi"
      option_amount: "User-selected trade amount T (incompatible with --money)"
      option_money: "Capital management r/o/n; r and n size T from K"
      option_capital: "Portfolio capital K used for financeability and, with --money, for sizing T (default: configured dedicated capital)"
      option_extended: "Display technical sizing details"
      examples: |
