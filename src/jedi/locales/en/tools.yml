        security: "Security"
        isin: "ISIN"
        price: "Selected price"
        price_source: "Price source"
        price_date: "Stored quotation date"
        scale: "Scale"
        mode: "Sizing"
        capital: "Capital K"
        risk_rate: "Risk r"
        steps_down: "Risk steps n"
        risk_distance: "Risk distance d"
        risk_amount: "Risk amount R"
        target_amount: "Trade amount T"
        quantity: "Opening quantity"
        opening_amount: "Actual opening amount"
        minimum_operable_quantity: "Minimum operable quantity"
        operability: "Operability"
        portfolio_capital: "Portfolio capital K"
        running_trades: "Open trades"
